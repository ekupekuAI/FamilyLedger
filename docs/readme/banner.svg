<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="title desc">
  <title id="title">FamilyLedger</title>
  <desc id="desc">FamilyLedger — track family money together, in real time.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="55%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#bbf7d0"/>
      <stop offset="100%" stop-color="#38bdf8"/>
      <animate attributeName="x1" values="0;-1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <style>
    .title { font: 800 76px 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; letter-spacing: -2px; }
    .tag { font: 500 26px 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #d1fae5; }
    .chip { font: 600 17px 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #ecfdf5; }
    .rise { opacity: 0; animation: rise 0.9s cubic-bezier(.22,1,.36,1) forwards; }
    .d1 { animation-delay: 0.15s; } .d2 { animation-delay: 0.45s; } .d3 { animation-delay: 0.75s; }
    .pulse { animation: pulse 4s ease-in-out infinite; transform-origin: 175px 150px; }
    .bar { transform-box: fill-box; transform-origin: bottom; animation: grow 1.1s cubic-bezier(.22,1,.36,1) both; }
    .b2 { animation-delay: .1s } .b3 { animation-delay: .2s } .b4 { animation-delay: .3s } .b5 { animation-delay: .4s }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%, 100% { opacity: .55; transform: scale(1); } 50% { opacity: .9; transform: scale(1.08); } }
    @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) {
      .rise, .pulse, .bar { animation: none; opacity: 1; transform: none; }
    }
  </style>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <circle class="pulse" cx="175" cy="150" r="120" fill="url(#glow)"/>

  <!-- wallet mark -->
  <g transform="translate(115 90)"><g class="rise">
    <rect width="120" height="120" rx="34" fill="#16a34a"/>
    <path d="M28 46h56a12 12 0 0 1 12 12v32a12 12 0 0 1-12 12H36a12 12 0 0 1-12-12V46l50-14a6 6 0 0 1 7.5 5.8V46" fill="none" stroke="#fff" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="80" cy="74" r="7" fill="#fff"/>
  </g></g>

  <text x="290" y="150" class="title rise d1" fill="url(#shine)">FamilyLedger</text>
  <text x="292" y="196" class="tag rise d2">Track family money together — in real time</text>

  <g transform="translate(292 222)"><g class="rise d3">
    <rect width="150" height="36" rx="18" fill="#ffffff" fill-opacity=".12"/>
    <text x="75" y="24" text-anchor="middle" class="chip">Send money</text>
    <rect x="162" width="150" height="36" rx="18" fill="#ffffff" fill-opacity=".12"/>
    <text x="237" y="24" text-anchor="middle" class="chip">Log expenses</text>
    <rect x="324" width="130" height="36" rx="18" fill="#ffffff" fill-opacity=".12"/>
    <text x="389" y="24" text-anchor="middle" class="chip">Settle up</text>
  </g></g>

  <!-- mini spending bars -->
  <g transform="translate(930 70)" opacity=".95">
    <rect x="0" y="0" width="200" height="160" rx="18" fill="#ffffff" fill-opacity=".08"/>
    <rect class="bar" x="22" y="78" width="22" height="62" rx="5" fill="#86efac" fill-opacity=".55"/>
    <rect class="bar b2" x="56" y="52" width="22" height="88" rx="5" fill="#86efac" fill-opacity=".55"/>
    <rect class="bar b3" x="90" y="66" width="22" height="74" rx="5" fill="#86efac" fill-opacity=".55"/>
    <rect class="bar b4" x="124" y="38" width="22" height="102" rx="5" fill="#86efac" fill-opacity=".55"/>
    <rect class="bar b5" x="158" y="24" width="22" height="116" rx="5" fill="#4ade80"/>
  </g>
  <circle cx="1100" cy="40" r="60" fill="#38bdf8" opacity=".12" filter="url(#soft)"/>
</svg>
